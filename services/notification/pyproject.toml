[project]
name = "notification"
version = "0.1.0"
description = "Notification service: RabbitMQ events to WebSocket clients"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.2.2",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestCacheWarning",
]
