[project]
name = "recommendation-grpc"
version = "0.1.0"
description = "Read-only gRPC recommendation service"
readme = "README.md"
authors = [
    { name = "AlexMayuri", email = "sasha.d1990@list.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "grpcio>=1.85.0",
    "grpcio-health-checking>=1.85.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::pytest.PytestCacheWarning",
]
