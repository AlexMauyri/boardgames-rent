upstream backend {
    server backend:8000;
}

upstream rustfs {
    server rustfs:9000;
}

geo $rate_limit_skip {
    default 0;
    127.0.0.1/32 1;
    10.0.0.0/8 1;
    172.16.0.0/12 1;
    192.168.0.0/16 1;
}

map $rate_limit_skip $api_key {
    0 $binary_remote_addr;
    1 "";
}
map $rate_limit_skip $auth_key {
    0 $binary_remote_addr;
    1 "";
}

limit_req_zone $api_key  zone=api_zone:10m  rate=120r/m;
limit_req_zone $auth_key zone=auth_zone:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /api/v1/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://rustfs/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;

        proxy_request_buffering off;
        proxy_buffering off;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}